<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NextDoor Skies (harness fixtures)</title>
    <link rel="icon" href="data:," />
    <style>
      /* Square geometry law: zero border-radius (R20). Harness tokens only. */
      :root {
        --bg: #0a0a0f;
        --surface: #14141c;
        --text: #f5f5f2;
        --border: #2a2a36;
        --accent: #00ff9d;
        --radius: 0px;
      }
      * { box-sizing: border-box; border-radius: 0; }
      body { margin: 0; background: var(--bg); color: var(--text); font-family: system-ui, sans-serif; }
      header { display: flex; align-items: center; gap: 16px; padding: 12px 16px; border-bottom: 1px solid var(--border); background: var(--surface); }
      header .brand { font-weight: 700; letter-spacing: 0.04em; }
      nav { display: flex; gap: 8px; margin-left: auto; }
      nav a { color: var(--text); text-decoration: none; padding: 8px 12px; border: 1px solid var(--border); }
      nav a[aria-current="page"] { border-color: var(--accent); color: var(--accent); }
      main { padding: 24px 16px; max-width: 960px; }
      h1 { font-size: 1.6rem; margin: 0 0 16px; border-left: 4px solid var(--accent); padding-left: 12px; }
      .card { border: 1px solid var(--border); background: var(--surface); padding: 12px; margin-bottom: 8px; }
      @media (max-width: 480px) { header { flex-wrap: wrap; } nav { margin-left: 0; width: 100%; } }
    </style>
  </head>
  <body>
    <header>
      <span class="brand">NEXTDOOR SKIES</span>
      <nav aria-label="Primary">
        <a href="/" data-route="/">Map</a>
        <a href="/feed" data-route="/feed">Feed</a>
      </nav>
    </header>
    <main id="view"></main>
    <script type="module" src="./router.js"></script>
  </body>
</html>
