name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  gate0:
    name: Gate 0 (tsc / eslint / build / vitest / static scans)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck (tsc -b)
        run: npx tsc -b
      - name: ESLint
        run: npm run lint
      - name: Production build
        run: npm run build
      - name: Vitest (unit + component, jsdom)
        run: npm test
      - name: Determinism scan (R17)
        run: npm run check:determinism
      - name: Radius scan (R20)
        run: npm run check:radius
      - name: No crypto-weather-central imports scan
        run: npm run check:no-cwc
