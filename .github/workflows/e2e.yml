name: e2e

# L2 PLAYWRIGHT-HARNESS CI job — gate foundation.
# Runs the 3-viewport suite against the harness fixtures target (self-sufficient)
# plus the console-collector negative selftest, and archives screenshots.

on:
  push:
    branches: [main, 'r2w1/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e2e:
    name: playwright (${{ matrix.project }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'

      - name: Install harness deps (isolated .e2e)
        run: node scripts/e2e-setup.mjs --with-deps

      - name: Selftest — console collector must fail a logging page
        run: node scripts/e2e-selftest.mjs

      - name: Run e2e suite (phone 390x844, tablet 768x1024, desktop 1280x800)
        run: node scripts/e2e-run.mjs

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-screenshots
          path: docs/screenshots/
          if-no-files-found: warn
          retention-days: 14

      - name: Upload playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
